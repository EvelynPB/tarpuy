services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tarpuy
      POSTGRES_USER: tarpuy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tarpuy"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configura ADMIN_PASSWORD en .env}
      DATABASE_URL: postgresql://tarpuy:${POSTGRES_PASSWORD}@db:5432/tarpuy
      NODE_ENV: development
      HOST: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
